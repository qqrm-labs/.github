name: Reusable Security

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language, or required comma-separated languages in default mode
        required: false
        type: string
        default: 'rust'
      codeql-mode:
        description: advanced, default (GitHub-managed), or unavailable (private repositories only)
        required: false
        type: string
        default: advanced

permissions: {}

jobs:
  gitleaks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the verified Gitleaks release
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-bin.XXXXXX")"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          printf 'GITLEAKS_BIN=%s\n' "$tool_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Verify detection and scan the complete fetched history
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import secrets
          import string
          import subprocess
          import sys
          import tempfile

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          binary = os.environ["GITLEAKS_BIN"]
          version = subprocess.check_output([binary, "version"], text=True).strip()
          if version != os.environ["GITLEAKS_VERSION"]:
              raise RuntimeError("The installed Gitleaks version does not match its pin")

          def git(repo, *args):
              return subprocess.check_output(
                  ["git", "-C", str(repo), *args], text=True, stderr=subprocess.PIPE
              ).strip()

          if git(workspace, "rev-parse", "--is-shallow-repository") != "false":
              raise RuntimeError("A complete, non-shallow checkout is required")
          commit_count = int(git(workspace, "rev-list", "--count", "--all"))
          ref_count = len(git(workspace, "for-each-ref", "--format=%(refname)").splitlines())
          if commit_count == 0:
              raise RuntimeError("Refusing an empty Git history")

          # Use the same checked-in policy for the controls and the real scan.
          config = workspace / ".gitleaks.toml"
          config_args = ["--config", str(config)] if config.is_file() else []
          scan_env = os.environ.copy()
          for key in ("GITLEAKS_CONFIG", "GITLEAKS_CONFIG_TOML"):
              scan_env.pop(key, None)

          def scan(source, report):
              result = subprocess.run(
                  [binary, "git", str(source),
                   "--log-opts=--all --full-history --diff-merges=first-parent --text --no-textconv --no-ext-diff",
                   "--redact=100", "--exit-code=2", "--no-banner", "--no-color",
                   "--ignore-gitleaks-allow", "--gitleaks-ignore-path", str(workspace),
                   "--report-format=json", "--report-path", str(report), *config_args],
                  cwd=workspace, env=scan_env, text=True, capture_output=True,
              )
              log = result.stdout + result.stderr
              report.with_suffix(".log").write_text(log, encoding="utf-8")
              if result.returncode not in (0, 2):
                  raise RuntimeError(
                      f"Gitleaks processing error (exit {result.returncode}); scan is not successful"
                  )
              counts = re.findall(r"\b([0-9]+) commits? scanned\.", log)
              if not counts or int(counts[-1]) == 0:
                  raise RuntimeError("Gitleaks did not scan any commits")
              findings = json.loads(report.read_text(encoding="utf-8"))
              if not isinstance(findings, list) or bool(findings) != (result.returncode == 2):
                  raise RuntimeError("Gitleaks exit status and report disagree")
              return result.returncode, findings, int(counts[-1])

          with tempfile.TemporaryDirectory(prefix="gitleaks-check-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              temp = Path(temporary)
              control = temp / "control"
              control.mkdir()
              git(control, "init", "--initial-branch=main")
              git(control, "config", "user.name", "Gitleaks detection control")
              git(control, "config", "user.email", "gitleaks-control@example.invalid")
              git(control, "config", "commit.gpgsign", "false")
              git(control, "config", "core.hooksPath", "/dev/null")

              def commit(message):
                  git(control, "add", "--all")
                  git(control, "commit", "-m", message)
                  return git(control, "rev-parse", "HEAD")

              expected = set()

              def seed(filename):
                  # Construct fake credentials at runtime; no real credential is used.
                  suffix = "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36))
                  (control / filename).write_text("gh" + "p_" + suffix + "\n", encoding="utf-8")
                  sha = commit("Add a synthetic detection control")
                  expected.add(("github-pat", filename, sha))

              (control / "README.txt").write_text("Clean detection control\n", encoding="utf-8")
              (control / ".gitattributes").write_text("attributes-secret.env -diff\n", encoding="utf-8")
              commit("Create a clean control")
              clean_status, _, _ = scan(control, temp / "clean.json")
              if clean_status != 0:
                  raise RuntimeError("The clean negative control failed")

              seed("deleted-secret.env")
              (control / "deleted-secret.env").unlink()
              commit("Remove the synthetic credential from HEAD")

              seed("attributes-secret.env")
              (control / "attributes-secret.env").unlink()
              commit("Remove the credential hidden by Git attributes")

              git(control, "checkout", "-b", "control-side-branch")
              seed("branch-secret.env")
              git(control, "checkout", "main")

              git(control, "checkout", "-b", "control-tag-branch")
              seed("tag-secret.env")
              git(control, "tag", "control-history-tag")
              git(control, "checkout", "main")
              git(control, "branch", "-D", "control-tag-branch")

              git(control, "checkout", "-b", "control-merge-parent")
              (control / "parent.txt").write_text("Harmless merge parent\n", encoding="utf-8")
              commit("Prepare a merge parent")
              git(control, "checkout", "main")
              git(control, "merge", "--no-ff", "--no-commit", "control-merge-parent")
              seed("merge-secret.env")
              (control / "merge-secret.env").unlink()
              commit("Remove the credential introduced only by the merge")

              status, findings, _ = scan(control, temp / "positive.json")
              observed = {(item["RuleID"], item["File"], item["Commit"]) for item in findings}
              if status != 2 or observed != expected:
                  raise RuntimeError("Detection control failed: history, attributes, branch, tag, or merge was missed")
              if any((control / filename).exists() for _, filename, _ in expected):
                  raise RuntimeError("The positive control must have a clean HEAD")
              print("PASS: clean control; deleted-history, attributes, branch-only, tag-only, and merge-only secrets detected")

              status, findings, scanned_count = scan(workspace, temp / "repository.json")
              summary = (
                  "## Gitleaks history scan\n\n"
                  f"- Scanner: {version}\n"
                  "- Detection controls: passed (clean, deleted history, attributes, branch, tag, merge)\n"
                  f"- Available commits: {commit_count}; refs: {ref_count}\n"
                  f"- Commits with scanned additions: {scanned_count}\n"
                  f"- Findings: {len(findings)}\n"
              )
              print(summary)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary)
              for item in findings:
                  print(json.dumps({key: item[key] for key in ("RuleID", "File", "StartLine", "Commit")}))
              sys.exit(status)

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create clean and unsafe workflow controls
        id: controls
        shell: python
        run: |
          import os
          from pathlib import Path
          import tempfile

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          controls = Path(tempfile.mkdtemp(prefix=".zizmor-control-", dir=workspace))
          prefix = (
              "name: Detection control\n"
              "on: pull_request\n"
              "permissions: {}\n"
              "jobs:\n"
              "  control:\n"
              "    runs-on: ubuntu-latest\n"
              "    steps:\n"
          )
          (controls / "clean.yml").write_text(prefix + "      - run: echo clean\n")
          expression = "$" + "{{ github.event.pull_request.title }}"
          (controls / "unsafe.yml").write_text(prefix + "      - run: echo " + expression + "\n")
          relative = controls.relative_to(workspace)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"clean={relative}/clean.yml\nunsafe={relative}/unsafe.yml\ndirectory={relative}\n")

      - name: Require the clean workflow control to pass
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e
        with:
          version: 1.24.1
          inputs: ${{ steps.controls.outputs.clean }}
          advanced-security: false
          online-audits: false
          color: false
          min-severity: medium

      - name: Detect template injection in the positive control
        id: positive
        continue-on-error: true
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e
        with:
          version: 1.24.1
          inputs: ${{ steps.controls.outputs.unsafe }}
          advanced-security: false
          online-audits: false
          color: false
          min-severity: medium

      - name: Require a real finding and remove the controls
        if: ${{ always() }}
        shell: python
        env:
          CONTROL_OUTCOME: ${{ steps.positive.outcome }}
          CONTROL_DIRECTORY: ${{ steps.controls.outputs.directory }}
        run: |
          import os
          from pathlib import Path
          import re
          import shutil

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          controls = (workspace / os.environ["CONTROL_DIRECTORY"]).resolve()
          if controls.parent != workspace or not controls.name.startswith(".zizmor-control-"):
              raise RuntimeError("Invalid detection-control directory")
          try:
              # This pinned action tees the scanner output to RUNNER_TEMP/zizmor.
              report = (Path(os.environ["RUNNER_TEMP"]) / "zizmor").read_text()
              if os.environ["CONTROL_OUTCOME"] != "failure" or not re.search(
                  r"(?:error|warning)\[template-injection\]", report
              ):
                  raise RuntimeError("The positive control must fail with a template-injection finding")
              print("PASS: clean workflow accepted; unsafe interpolation rejected")
          finally:
              shutil.rmtree(controls)

      - name: Audit the repository workflows
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e
        with:
          version: 1.24.1
          advanced-security: false
          min-severity: medium

  codeql-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      run-advanced: ${{ steps.policy.outputs.run-advanced }}
    steps:
      - name: Verify the CodeQL execution mode
        id: policy
        shell: python
        env:
          CODEQL_MODE: ${{ inputs.codeql-mode }}
          CODEQL_LANGUAGES: ${{ inputs.language }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CODEQL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # BEGIN CODEQL MODE POLICY
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          NATIVE_PATH = "dynamic/github-code-scanning/codeql"

          def validate_mode(mode, private, language):
              if mode not in {"advanced", "default", "unavailable"}:
                  raise RuntimeError("Unknown codeql-mode; expected advanced, default, or unavailable")
              languages = [part.strip() for part in language.split(",")]
              if not languages or any(not re.fullmatch(r"[a-z]+(?:-[a-z]+)*", item) for item in languages):
                  raise RuntimeError("CodeQL languages must be nonempty canonical language names")
              if len(set(languages)) != len(languages):
                  raise RuntimeError("Duplicate CodeQL language")
              if mode == "unavailable" and private != "true":
                  raise RuntimeError("Unavailable CodeQL is permitted only for an explicitly private repository")
              return languages

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def get_json(path):
              request = Request(os.environ["GITHUB_API_URL"].rstrip("/") + path, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with build_opener(NoRedirect()).open(request, timeout=20) as response:
                      return json.load(response)
              except (HTTPError, URLError) as error:
                  code = getattr(error, "code", "network error")
                  raise RuntimeError(f"GitHub Actions API failed ({code}); delegated CodeQL is unverified") from None

          def records(path, key):
              result = []
              separator = "&" if "?" in path else "?"
              for page in range(1, 11):
                  data = get_json(f"{path}{separator}per_page=100&page={page}")
                  items = data.get(key)
                  if not isinstance(items, list):
                      raise RuntimeError(f"GitHub Actions API did not return {key}")
                  result.extend(items)
                  if len(items) < 100:
                      return result
              raise RuntimeError("GitHub Actions API pagination limit exceeded; CodeQL is unverified")

          def current_scan_required(event, ref, default_branch, protected, repository,
                                    head_repository="", base_ref=""):
              if event not in {"push", "pull_request", "workflow_dispatch", "schedule"}:
                  raise RuntimeError("Default CodeQL delegation does not support this event")
              if not default_branch or protected not in {"true", "false"}:
                  raise RuntimeError("Missing repository branch context for Default CodeQL")
              if event == "pull_request":
                  if not repository or not head_repository or not base_ref:
                      raise RuntimeError("Missing pull-request repository or base branch context")
                  # A target repository can itself be a fork; compare identities.
                  if head_repository.lower() != repository.lower():
                      return False
                  if base_ref == default_branch:
                      return True
                  branch = get_json(f"/repos/{repository}/branches/{quote(base_ref, safe='')}")
                  if not isinstance(branch.get("protected"), bool):
                      raise RuntimeError("Base-branch protection could not be verified")
                  return branch["protected"]
              return (
                  ref.startswith("refs/heads/") and
                  (ref == "refs/heads/" + default_branch or protected == "true")
              )

          def require_analysis_jobs(run, jobs, languages):
              if run.get("conclusion") != "success":
                  raise RuntimeError("The native Default CodeQL run did not complete successfully")
              for language in languages:
                  matching = [job for job in jobs if job.get("name") == f"Analyze ({language})"]
                  if (len(matching) != 1 or matching[0].get("status") != "completed"
                          or matching[0].get("conclusion") != "success"):
                      raise RuntimeError(f"Native Default CodeQL did not complete analysis for {language}")

          def verify_default(languages):
              repo = "/repos/" + os.environ["GITHUB_REPOSITORY"]
              workflows = records(repo + "/actions/workflows", "workflows")
              native = [item for item in workflows if item.get("path") == NATIVE_PATH]
              if len(native) != 1 or native[0].get("state") != "active":
                  raise RuntimeError("An active GitHub-managed Default CodeQL workflow is required")
              required = current_scan_required(
                  os.environ["GITHUB_EVENT_NAME"], os.environ["GITHUB_REF"],
                  os.environ["DEFAULT_BRANCH"], os.environ["GITHUB_REF_PROTECTED"],
                  os.environ["GITHUB_REPOSITORY"], os.environ.get("PR_HEAD_REPOSITORY", ""),
                  os.environ.get("PR_BASE_REF", ""),
              )
              if not required:
                  return ("GitHub-managed Default CodeQL is active. This event is outside Default setup's "
                          "trigger scope; no CodeQL analysis is claimed for this event.")

              sha = os.environ["CODEQL_HEAD_SHA"]
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise RuntimeError("A full source commit SHA is required to verify Default CodeQL")
              path = f"{repo}/actions/workflows/{native[0]['id']}/runs?head_sha={sha}"
              deadline = time.monotonic() + 12 * 60
              while True:
                  runs = [run for run in records(path, "workflow_runs")
                          if run.get("path") == NATIVE_PATH and run.get("head_sha") == sha]
                  run = max(runs, key=lambda item: item["id"]) if runs else None
                  if run and run.get("status") == "completed":
                      jobs = records(f"{repo}/actions/runs/{run['id']}/jobs?filter=latest", "jobs")
                      require_analysis_jobs(run, jobs, languages)
                      return (f"GitHub-managed Default CodeQL completed for `{sha}` with "
                              f"languages: {', '.join(languages)}. Native run: {run['html_url']}. "
                              "The separate CodeQL result check evaluates findings; this policy "
                              "check does not assert that the code has no vulnerabilities.")
                  if time.monotonic() >= deadline:
                      raise RuntimeError("No completed native Default CodeQL analysis for this commit within 12 minutes")
                  print("Waiting for the independent native Default CodeQL run...", flush=True)
                  time.sleep(15)

          def main():
              mode = os.environ["CODEQL_MODE"]
              languages = validate_mode(mode, os.environ["REPOSITORY_PRIVATE"], os.environ["CODEQL_LANGUAGES"])
              if mode == "default":
                  message = verify_default(languages)
              elif mode == "unavailable":
                  message = ("CodeQL was NOT run: this private repository explicitly declares Code Security "
                             "unavailable. This is a coverage limitation, not a successful CodeQL scan. "
                             "Gitleaks and workflow security remain independent blocking checks.")
                  print("::notice::" + message)
              else:
                  message = "Advanced CodeQL analysis is required and runs in the dependent codeql job."
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## CodeQL execution mode: {mode}\n\n{message}\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"run-advanced={'true' if mode == 'advanced' else 'false'}\n")

          if __name__ == "__main__":
              main()
          # END CODEQL MODE POLICY

  codeql:
    needs: codeql-policy
    if: ${{ needs.codeql-policy.outputs.run-advanced == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ inputs.language }}
